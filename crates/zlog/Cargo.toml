[package]
name = "zlog"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/zlog.rs"

[features]
default = []

[dependencies]
collections.workspace = true
chrono.workspace = true
# `std` because `try_init` propagates `log`'s SetLoggerError with `?`, and that
# error only implements std::error::Error when the feature is on. Without it this
# crate does not build on its own, only inside a graph where something else asks
# for the feature.
log = { workspace = true, features = ["std"] }
anyhow.workspace = true

[dev-dependencies]
tempfile.workspace = true
