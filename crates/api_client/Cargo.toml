[package]
name = "api_client"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/api_client.rs"
doctest = false

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
base64.workspace = true
boa_engine = "0.21.1"
futures.workspace = true
hmac = "0.12"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
protox = "0.9"
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `net` is what looks a host up before a request goes out, so the reader can see
# what the lookup cost.
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net"] }
tokio-stream = "0.1.18"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-reflection = "0.14"
urlencoding.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
