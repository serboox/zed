name = "Visual Basic"
grammar = "vb6"
path_suffixes = ["bas", "cls", "frm", "vbs", "vb"]
line_comments = ["' "]
autoclose_before = ",)"
brackets = [
    { start = "(", end = ")", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
]
