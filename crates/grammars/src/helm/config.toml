# A chart template is a Go template that produces YAML, not YAML. It is read
# with the Go template grammar, which knows what an action is, and the text
# between the actions is handed to the YAML grammar as one document. Read as
# YAML alone the file falls apart at the first `{{- if }}`, and everything
# below it loses its colour.
#
# It is a language of its own so that a YAML language server -- which cannot
# follow an action either, and reports every one of them as a fault -- is not
# attached to it. What checks these files is the editor's own reader, which
# knows to set the actions aside.
name = "Helm"
grammar = "gotmpl"
path_suffixes = ["tpl", "gotmpl"]
line_comments = ["# "]
autoclose_before = ",]}"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]

auto_indent_on_paste = false
auto_indent_using_last_non_empty_line = false
increase_indent_pattern = "(:?^[^#]*:\\s*[|>]?\\s*$)|(:?^\\s*-[^#]*:\\s*(:?#+.*)$)"
tab_size = 2
