# A chart template is a Go template that produces YAML, not YAML. It is read
# with the YAML grammar because everything around the template actions is YAML
# and that is what a reader wants coloured, but it is a language of its own so
# that a YAML language server -- which cannot follow `{{ ... }}` and reports
# every one of them as a fault -- is not attached to it. What checks these
# files is the editor's own reader, which knows to set the actions aside.
name = "Helm"
grammar = "yaml"
path_suffixes = ["tpl", "gotmpl"]
line_comments = ["# "]
autoclose_before = ",]}"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]

auto_indent_on_paste = false
auto_indent_using_last_non_empty_line = false
increase_indent_pattern = "(:?^[^#]*:\\s*[|>]?\\s*$)|(:?^\\s*-[^#]*:\\s*(:?#+.*)$)"
tab_size = 2
