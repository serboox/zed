name = "SQL"
grammar = "sql"
path_suffixes = ["sql"]
modeline_aliases = ["sql"]
line_comments = ["-- "]
block_comment = { start = "/*", prefix = "* ", end = "*/", tab_size = 1 }
autoclose_before = ",)];"
brackets = [
    { start = "(", end = ")", close = true, newline = true },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
]
tab_size = 2
