[package]
name = "html_render"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/html_render.rs"
doctest = false

# Servo brings SpiderMonkey and some six hundred crates with it, so it is opt-in:
# an ordinary build stays as fast as it was, and the shipped binary is built with
# `--features servo`.
[features]
default = []
servo = [
    "dep:dpi",
    "dep:euclid",
    "dep:gleam",
    "dep:glow",
    "dep:surfman",
    "dep:keyboard_types",
    "dep:primeorder",
    "dep:image",
    "dep:libc",
    "dep:servo",
    "dep:smallvec",
    "dep:tempfile",
    "dep:url",
]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
gpui.workspace = true
log.workspace = true

dpi = { workspace = true, optional = true }
euclid = { workspace = true, optional = true }
keyboard_types = { workspace = true, optional = true }
image = { workspace = true, optional = true }
# The page's own frame buffer is asked for through the graphics driver's
# allocator, which is reached the way every other driver entry point is.
libc = { workspace = true, optional = true }
# A pin, not a use: servo-script requires release-candidate elliptic curve crates
# that do not build against the stable primeorder cargo would pick on its own.
primeorder = { workspace = true, optional = true }
servo = { workspace = true, optional = true }
# The page is drawn by the graphics card through these: Servo's own offscreen
# context asks surfman for a software adapter instead.
gleam = { version = "0.15", optional = true }
glow = { version = "0.17", optional = true }
surfman = { version = "0.13", optional = true }
smallvec = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
libc.workspace = true
keyboard_types.workspace = true
