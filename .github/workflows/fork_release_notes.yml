name: Refresh the fork release descriptions

# Only the first release describes the fork against upstream Zed; every later
# one says what changed since the release before it, and nothing else. Those
# words live in .github/release-changes/<tag>.md, so rewording one should not
# need a three-hour rebuild: this rewrites each release that has such a file
# in place and keeps its files.
on:
  push:
    branches: [personal_zed_fork]
    paths:
      - .github/release-changes/**
      - .github/workflows/fork_release_notes.yml
  workflow_dispatch:

concurrency:
  group: fork-release-notes
  cancel-in-progress: true

jobs:
  refresh:
    name: Write what changed into each release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The build line and the file table above the first heading belong to
      # the release and are kept as they were; everything from the first
      # heading on is replaced by the release's own file.
      - name: Rewrite the descriptions
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName -q '.[].tagName' > tags.txt
          while read -r tag; do
            changes=".github/release-changes/$tag.md"
            [ -f "$changes" ] || continue
            gh release view "$tag" --json body -q .body \
              | awk '/^## / { exit } { print }' > notes.md
            cat "$changes" >> notes.md
            gh release edit "$tag" --notes-file notes.md < /dev/null
            echo "Rewrote the description of \`$tag\`." >> "$GITHUB_STEP_SUMMARY"
          done < tags.txt
        env:
          GH_TOKEN: ${{ github.token }}
