name: Bundle this fork

# Every platform is built where it runs. Windows and macOS cannot be
# cross-compiled from Linux at all -- their renderers compile shaders with
# `fxc.exe` and `xcrun metal`, both host tools -- and the embedded HTML engine
# only has prebuilt SpiderMonkey archives for native targets.
#
# Each job also runs the engine's own integration tests, so the answer to "does
# HTML rendering work on that platform" comes from the platform itself rather
# than from hope. The tests report `HTML_ENGINE: ok` or, on a machine whose
# graphics stack the engine cannot use, `HTML_ENGINE: unavailable`, and the job
# summary repeats whichever it was.
on:
  push:
    branches: [personal_zed_fork, bundle/**]
  workflow_dispatch:
    inputs:
      linux:
        description: Linux tarball, .deb and .rpm
        type: boolean
        default: true
      windows:
        description: Windows x86_64 executable
        type: boolean
        default: true
      macos:
        description: macOS app
        type: choice
        default: arm64
        options: [none, arm64, x86_64, both]
      html_engine:
        description: Include the embedded HTML engine (Servo)
        type: boolean
        default: true

# A newer push replaces an older one rather than queueing behind it.
concurrency:
  group: fork-bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # `release-fast` carries full debug info, which costs minutes of build time
  # and hundreds of megabytes in an artifact nobody will debug.
  CARGO_PROFILE_RELEASE_FAST_DEBUG: "false"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      windows: ${{ steps.pick.outputs.windows }}
      macos: ${{ steps.pick.outputs.macos }}
      engine: ${{ steps.pick.outputs.engine }}
    steps:
      # A push carries no inputs, so every empty value falls back to the
      # default the dispatch form offers.
      - id: pick
        env:
          LINUX: ${{ inputs.linux }}
          WINDOWS: ${{ inputs.windows }}
          MACOS: ${{ inputs.macos }}
          ENGINE: ${{ inputs.html_engine }}
        run: |
          set -euo pipefail
          for what in LINUX WINDOWS; do
            key="$(echo "$what" | tr '[:upper:]' '[:lower:]')"
            if [ "${!what}" = "false" ]; then
              echo "$key=no" >> "$GITHUB_OUTPUT"
            else
              echo "$key=yes" >> "$GITHUB_OUTPUT"
            fi
          done
          if [ "$ENGINE" = "false" ]; then
            echo "engine=" >> "$GITHUB_OUTPUT"
          else
            echo "engine=--features servo" >> "$GITHUB_OUTPUT"
          fi
          case "${MACOS:-arm64}" in
            arm64)  macos='[{"arch":"arm64","runner":"macos-latest"}]' ;;
            x86_64) macos='[{"arch":"x86_64","runner":"macos-15-intel"}]' ;;
            both)   macos='[{"arch":"arm64","runner":"macos-latest"},{"arch":"x86_64","runner":"macos-15-intel"}]' ;;
            *)      macos='[]' ;;
          esac
          echo "macos=$macos" >> "$GITHUB_OUTPUT"

  linux:
    needs: plan
    if: needs.plan.outputs.linux == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install the editor's build dependencies
        run: script/linux

      - name: Install the packaging and headless-graphics tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xvfb mesa-vulkan-drivers libegl1 libgl1 gettext-base
          sudo gem install --no-document fpm

      - run: rustup show

      # The engine's nine hundred crates never change, so compiling them once per
      # push is the whole cost of these runs. This keeps the dependency artifacts
      # between runs; the workspace's own crates are dropped before saving, so
      # what comes back is only the part that would have been identical anyway.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fork-bundle-linux
          cache-on-failure: true

      - name: Build the packages with the HTML engine
        id: engine
        if: needs.plan.outputs.engine != ''
        continue-on-error: true
        env:
          CARGO_ARGS: ${{ needs.plan.outputs.engine }}
        run: script/fork-bundle-linux

      - name: Build the packages without the HTML engine
        if: needs.plan.outputs.engine == '' || steps.engine.outcome == 'failure'
        run: script/fork-bundle-linux

      - uses: actions/upload-artifact@v4
        with:
          name: zed-linux-x86_64
          path: target/fork-packages/*
          if-no-files-found: error

      # A package that installs and answers is worth more than a package that
      # merely exists: this catches a wrong path, a broken launcher symlink or a
      # missing library before the file reaches anyone.
      - name: Install the .deb and ask the editor its version
        run: |
          set -euo pipefail
          sudo dpkg -i target/fork-packages/zed-fork_*.deb
          zed-fork --version
          rpm -qlp target/fork-packages/zed-fork-*.rpm | head -20
          sudo dpkg -r zed-fork

      - name: Test the HTML engine
        if: steps.engine.outcome == 'success'
        run: |
          set -o pipefail
          xvfb-run -a cargo test --profile release-fast --package html_render \
            --features servo -- --nocapture 2>&1 | tee engine-test.log

      - name: Say whether the engine ran here
        if: always() && steps.engine.outcome == 'success'
        run: grep -m1 '^HTML_ENGINE:' engine-test.log >> "$GITHUB_STEP_SUMMARY" || true

  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'yes'
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # One dependency carries test fixtures with paths past the Windows limit,
      # and cargo's built-in git client cannot write them: `class=Filesystem
      # (30)` on a checkout of python-environment-tools. git.exe can, with long
      # paths turned on, and a short CARGO_HOME keeps the rest well clear.
      - name: Let Windows take long paths
        run: |
          git config --system core.longpaths true
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Add-Content $env:GITHUB_ENV
          "CARGO_HOME=D:\c" | Add-Content $env:GITHUB_ENV

      # The TLS backend the engine pulls in assembles its own x86_64 primitives.
      - name: Install NASM
        run: choco install nasm --no-progress -y
        continue-on-error: true

      - name: Add NASM to the path
        run: Add-Content $env:GITHUB_PATH "C:\Program Files\NASM"

      # The engine's media backend is built against GStreamer, and its bindings
      # ask pkg-config for the real library rather than taking the feature's word
      # for it -- so without this the engine does not compile here at all. It only
      # ever seemed to: a warm cache carried the already-built bindings from run
      # to run, and the first build on a branch of its own found nothing and
      # stopped at `glib-sys`.
      #
      # Both packages are needed and neither is redundant: the runtime one brings
      # the libraries and pkg-config itself, the development one the headers and
      # the `.pc` files that describe them. Nothing else has to be installed --
      # in particular no pkg-config from anywhere else, which is worth knowing,
      # since the usual one fetches itself over plain HTTP with no checksum.
      - name: Install GStreamer
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.26.6'
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
          foreach ($msi in "gstreamer-1.0-msvc-x86_64-$version.msi",
                           "gstreamer-1.0-devel-msvc-x86_64-$version.msi") {
            $file = Join-Path $env:RUNNER_TEMP $msi
            Invoke-WebRequest -Uri "$base/$msi" -OutFile $file
            $log = "$file.log"
            $run = Start-Process msiexec.exe -Wait -PassThru -ArgumentList `
              '/i', "`"$file`"", '/qn', '/norestart', 'ADDLOCAL=ALL', '/l*v', "`"$log`""
            if ($run.ExitCode -ne 0) {
              if (Test-Path $log) { Get-Content $log -Tail 40 }
              throw "$msi would not install: exit code $($run.ExitCode)"
            }
          }

          # Found rather than assumed: the installer roots its own tree, and a
          # guessed path would fail much later inside a build script instead.
          $described = @('C:\gstreamer', "$env:ProgramFiles\gstreamer",
                         "${env:ProgramFiles(x86)}\gstreamer") |
            Where-Object { Test-Path $_ } |
            ForEach-Object {
              Get-ChildItem $_ -Recurse -Filter 'gstreamer-1.0.pc' -ErrorAction SilentlyContinue
            } | Select-Object -First 1
          if (-not $described) { throw 'GStreamer installed but describes nothing to pkg-config' }
          $pkgconfig = $described.Directory.FullName
          $root = Split-Path (Split-Path $pkgconfig)
          $exe = Join-Path $root 'bin\pkg-config.exe'
          if (-not (Test-Path $exe)) {
            Get-ChildItem (Join-Path $root 'bin') -Filter '*pkg*' | ForEach-Object { $_.Name }
            throw "GStreamer brought no pkg-config: nothing at $exe"
          }

          # Asked here rather than left for the build to discover: this is the one
          # question the whole engine build rests on, and the answer costs seconds.
          $env:PKG_CONFIG_PATH = $pkgconfig
          & $exe --modversion glib-2.0 gstreamer-1.0 gstreamer-play-1.0
          if ($LASTEXITCODE -ne 0) { throw "pkg-config cannot describe GStreamer from $pkgconfig" }

          "PKG_CONFIG_PATH=$pkgconfig" | Add-Content $env:GITHUB_ENV
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" | Add-Content $env:GITHUB_ENV
          Add-Content $env:GITHUB_PATH (Join-Path $root 'bin')

      - run: rustup show

      # Same reason as the Linux job: the engine's crates are identical from run
      # to run, so they are compiled once and kept.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fork-bundle-${{ runner.os }}
          cache-on-failure: true

      # Whether this window can be handed a frame at all is about the window's own
      # graphics device and not about the engine, so it is asked first: the answer
      # is worth having even from a run where nothing else builds.
      - name: Test what the window can be lent
        shell: bash
        run: |
          set -o pipefail
          cargo test --profile release-fast --package gpui_windows -- --nocapture 2>&1 |
            tee window-test.log

      - name: Say what the window found
        if: always()
        shell: bash
        run: grep -m1 '^SHARED:' window-test.log >> "$GITHUB_STEP_SUMMARY" || true

      # As an artifact as well as in the summary: an artifact can be fetched while
      # the rest of the run is still going, and a summary can only be looked at.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-window-test-log
          path: window-test.log
          if-no-files-found: ignore

      # Without colour, so that what went wrong can be picked out of the log
      # rather than read by eye once the run has finished.
      - name: Build with the HTML engine
        id: engine
        if: needs.plan.outputs.engine != ''
        continue-on-error: true
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo build --profile release-fast --package zed ${{ needs.plan.outputs.engine }} 2>&1 |
            tee engine-build.log

      # A build that fails here is followed by a whole build without the engine,
      # and a job's log can only be read once the job has finished -- so what
      # stopped it goes in the summary, which can be read while the rest runs.
      - name: Say what stopped the engine building
        if: always() && steps.engine.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '```'
            grep -E '^error' -A 12 engine-build.log | head -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && steps.engine.outcome == 'failure'
        with:
          name: windows-engine-build-log
          path: engine-build.log
          if-no-files-found: ignore

      - name: Build without the HTML engine
        if: needs.plan.outputs.engine == '' || steps.engine.outcome == 'failure'
        run: cargo build --profile release-fast --package zed

      # Proof that what was built starts at all, which a compile alone does not
      # promise on a platform nobody here can run.
      - name: Ask the editor for its usage
        run: target/release-fast/zed.exe --help

      - name: Report what came out
        run: |
          $exe = Get-Item target/release-fast/zed.exe
          $engine = if ('${{ steps.engine.outcome }}' -eq 'success') { 'yes' } else { 'no' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Add-Content $env:GITHUB_STEP_SUMMARY "size: $($exe.Length) bytes"
          Add-Content $env:GITHUB_STEP_SUMMARY "HTML engine compiled in: $engine"
          Add-Content $env:GITHUB_STEP_SUMMARY "sha256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: zed-windows-x86_64
          path: target/release-fast/zed.exe
          if-no-files-found: error

      # Under bash, so that a failing test fails the step: PowerShell's own
      # pipeline swallows the exit code of whatever wrote into it, and merging
      # cargo's stderr there turns every progress line into an error.
      - name: Test the HTML engine
        if: steps.engine.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          cargo test --profile release-fast --package html_render \
            --features servo -- --nocapture 2>&1 | tee engine-test.log

      - name: Say whether the engine ran here
        if: always() && steps.engine.outcome == 'success'
        shell: bash
        run: grep -m1 '^HTML_ENGINE:' engine-test.log >> "$GITHUB_STEP_SUMMARY" || true

      # Last, so the editor and its artifact still come out of a run where the
      # engine would not compile -- but the run says so instead of passing
      # quietly with an editor that has no engine in it.
      - name: Insist the engine compiled
        if: needs.plan.outputs.engine != '' && steps.engine.outcome != 'success'
        shell: bash
        run: |
          echo "the HTML engine did not compile here; the editor above was built without it" >&2
          exit 1

  macos:
    needs: plan
    if: needs.plan.outputs.macos != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.macos) }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - run: rustup show

      # Same reason as the Linux job: the engine's crates are identical from run
      # to run, so they are compiled once and kept.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fork-bundle-${{ runner.os }}
          cache-on-failure: true

      - name: Build with the HTML engine
        id: engine
        if: needs.plan.outputs.engine != ''
        continue-on-error: true
        run: cargo build --profile release-fast --package zed ${{ needs.plan.outputs.engine }}

      - name: Build without the HTML engine
        if: needs.plan.outputs.engine == '' || steps.engine.outcome == 'failure'
        run: cargo build --profile release-fast --package zed

      # Proof that what was built starts at all, which a compile alone does not
      # promise on a platform nobody here can run.
      - name: Ask the editor for its usage
        run: target/release-fast/zed --help

      # A hand-made bundle rather than `script/bundle-mac`: that script also
      # builds the remote server, downloads a git to embed and signs with the
      # project's own identity, none of which a test build needs.
      - name: Wrap the binary in an app bundle
        run: |
          set -euo pipefail
          app="target/Zed.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release-fast/zed "$app/Contents/MacOS/zed"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Zed</string>
            <key>CFBundleDisplayName</key><string>Zed</string>
            <key>CFBundleIdentifier</key><string>dev.zed.Zed-Dev</string>
            <key>CFBundleExecutable</key><string>zed</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.0.0</string>
            <key>CFBundleVersion</key><string>0.0.0</string>
            <key>LSMinimumSystemVersion</key><string>10.15.7</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "target/Zed-macos-${{ matrix.target.arch }}.app.zip"
          if [ '${{ steps.engine.outcome }}' = 'success' ]; then engine=yes; else engine=no; fi
          {
            echo "size: $(du -h "target/Zed-macos-${{ matrix.target.arch }}.app.zip" | cut -f1)"
            echo "HTML engine compiled in: $engine"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: zed-macos-${{ matrix.target.arch }}
          path: target/Zed-macos-${{ matrix.target.arch }}.app.zip
          if-no-files-found: error

      - name: Test the HTML engine
        if: steps.engine.outcome == 'success'
        run: |
          set -o pipefail
          cargo test --profile release-fast --package html_render \
            --features servo -- --nocapture 2>&1 | tee engine-test.log

      - name: Say whether the engine ran here
        if: always() && steps.engine.outcome == 'success'
        run: grep -m1 '^HTML_ENGINE:' engine-test.log >> "$GITHUB_STEP_SUMMARY" || true
