name: Bundle this fork

# Every platform is built where it runs. Windows and macOS cannot be
# cross-compiled from Linux at all -- their renderers compile shaders with
# `fxc.exe` and `xcrun metal`, both host tools -- and the embedded HTML engine
# only has prebuilt SpiderMonkey archives for native targets.
#
# Each job also runs the engine's own integration tests, so the answer to "does
# HTML rendering work on that platform" comes from the platform itself rather
# than from hope. The tests report `HTML_ENGINE: ok` or, on a machine whose
# graphics stack the engine cannot use, `HTML_ENGINE: unavailable`, and the job
# summary repeats whichever it was.
on:
  # A release a week, when the editor changed in that week -- the release job
  # says no when it did not. GitHub reads a scheduled workflow from the
  # repository's default branch, so this only fires while that is the fork's
  # own branch.
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [personal_zed_fork, bundle/**]
  workflow_dispatch:
    inputs:
      linux:
        description: Linux tarball, .deb and .rpm
        type: boolean
        default: true
      windows:
        description: Windows x86_64 executable
        type: boolean
        default: true
      macos:
        description: macOS app
        type: choice
        default: arm64
        options: [none, arm64, x86_64, both]
      html_engine:
        description: Include the embedded HTML engine (Servo)
        type: boolean
        default: true

# A newer push replaces an older one rather than queueing behind it.
concurrency:
  group: fork-bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # `release-fast` carries full debug info, which costs minutes of build time
  # and hundreds of megabytes in an artifact nobody will debug.
  CARGO_PROFILE_RELEASE_FAST_DEBUG: "false"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      windows: ${{ steps.pick.outputs.windows }}
      macos: ${{ steps.pick.outputs.macos }}
      engine: ${{ steps.pick.outputs.engine }}
    steps:
      # A push carries no inputs, so every empty value falls back to the
      # default the dispatch form offers.
      - id: pick
        env:
          LINUX: ${{ inputs.linux }}
          WINDOWS: ${{ inputs.windows }}
          MACOS: ${{ inputs.macos }}
          ENGINE: ${{ inputs.html_engine }}
        run: |
          set -euo pipefail
          for what in LINUX WINDOWS; do
            key="$(echo "$what" | tr '[:upper:]' '[:lower:]')"
            if [ "${!what}" = "false" ]; then
              echo "$key=no" >> "$GITHUB_OUTPUT"
            else
              echo "$key=yes" >> "$GITHUB_OUTPUT"
            fi
          done
          if [ "$ENGINE" = "false" ]; then
            echo "engine=" >> "$GITHUB_OUTPUT"
          else
            echo "engine=--features servo" >> "$GITHUB_OUTPUT"
          fi
          case "${MACOS:-arm64}" in
            arm64)  macos='[{"arch":"arm64","runner":"macos-latest"}]' ;;
            x86_64) macos='[{"arch":"x86_64","runner":"macos-15-intel"}]' ;;
            both)   macos='[{"arch":"arm64","runner":"macos-latest"},{"arch":"x86_64","runner":"macos-15-intel"}]' ;;
            *)      macos='[]' ;;
          esac
          echo "macos=$macos" >> "$GITHUB_OUTPUT"

  # Nothing is packaged from a tree whose tests do not pass. An artifact that
  # installs and then misbehaves costs more than one that was never built, and
  # the three packaging jobs together run for hours -- this is the cheapest
  # place to find out.
  tests:
    name: Run the whole suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The suite's own build is what fills a runner's disk: every test binary
      # of a 200-crate workspace carries debug info nobody here reads, and the
      # run died writing its own log with "No space left on device". Nothing in
      # this job debugs a test, so none of it is built.
      CARGO_PROFILE_DEV_DEBUG: "false"
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      # A runner arrives with tens of gigabytes of toolchains for languages this
      # editor is not written in. They are worth more as free space.
      - name: Make room for the build
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h /
      - name: Install the editor's build dependencies
        run: script/linux
      # `script/linux` installs the Vulkan loader but no driver for it to load,
      # and a runner has no graphics card. The renderer's own tests ask for an
      # adapter and get "vulkan drivers/libraries could not be loaded" without
      # this; the packaging job below already installs it for the same reason.
      - name: Install a graphics driver the renderer's tests can use
        run: sudo apt-get install -y mesa-vulkan-drivers libegl1 libgl1
      - uses: ./.github/actions/run_tests

  linux:
    needs: [plan, tests]
    if: needs.plan.outputs.linux == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install the editor's build dependencies
        run: script/linux

      - name: Install the packaging and headless-graphics tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xvfb mesa-vulkan-drivers libegl1 libgl1 gettext-base
          sudo gem install --no-document fpm

      - run: rustup show

      # The engine's nine hundred crates never change, so compiling them once per
      # push is the whole cost of these runs. This keeps the dependency artifacts
      # between runs; the workspace's own crates are dropped before saving, so
      # what comes back is only the part that would have been identical anyway.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fork-bundle-linux
          cache-on-failure: true

      - name: Build the packages with the HTML engine
        id: engine
        if: needs.plan.outputs.engine != ''
        continue-on-error: true
        env:
          CARGO_ARGS: ${{ needs.plan.outputs.engine }}
        run: script/fork-bundle-linux

      - name: Build the packages without the HTML engine
        if: needs.plan.outputs.engine == '' || steps.engine.outcome == 'failure'
        run: script/fork-bundle-linux

      - uses: actions/upload-artifact@v4
        with:
          name: zed-linux-x86_64
          path: target/fork-packages/*
          if-no-files-found: error

      # A package that installs and answers is worth more than a package that
      # merely exists: this catches a wrong path, a broken launcher symlink or a
      # missing library before the file reaches anyone.
      - name: Install the .deb and ask the editor its version
        run: |
          set -euo pipefail
          sudo dpkg -i target/fork-packages/zed-fork_*.deb
          zed-fork --version
          sudo dpkg -r zed-fork

      # The .rpm was only ever listed, never installed, so nothing said whether
      # it would install at all. It is installed on the distribution that reads
      # it -- a container, since this runner is Debian -- and the editor is
      # asked its version from where the package put it.
      - name: Install the .rpm in a Fedora container and ask the same
        run: |
          set -euo pipefail
          rpm="$(ls target/fork-packages/zed-fork-*.rpm)"
          docker run --rm -v "$PWD:/work" -w /work fedora:latest bash -euxc "
            dnf install -y shadow-utils util-linux '$rpm'
            # The editor refuses to run as root, and everything in a container
            # is root unless somebody else is made, so somebody else is made.
            useradd --create-home someone
            runuser -l someone -c 'zed-fork --version'
            rpm -e zed-fork
          "

      - name: Test the HTML engine
        if: steps.engine.outcome == 'success'
        run: |
          set -o pipefail
          xvfb-run -a cargo test --profile release-fast --package html_render \
            --features servo -- --nocapture 2>&1 | tee engine-test.log

      - name: Say whether the engine ran here
        if: always() && steps.engine.outcome == 'success'
        run: grep -m1 '^HTML_ENGINE:' engine-test.log >> "$GITHUB_STEP_SUMMARY" || true

  windows:
    needs: [plan, tests]
    if: needs.plan.outputs.windows == 'yes'
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # One dependency carries test fixtures with paths past the Windows limit,
      # and cargo's built-in git client cannot write them: `class=Filesystem
      # (30)` on a checkout of python-environment-tools. git.exe can, with long
      # paths turned on, and a short CARGO_HOME keeps the rest well clear.
      - name: Let Windows take long paths
        run: |
          git config --system core.longpaths true
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Add-Content $env:GITHUB_ENV
          "CARGO_HOME=D:\c" | Add-Content $env:GITHUB_ENV

      # The TLS backend the engine pulls in assembles its own x86_64 primitives.
      - name: Install NASM
        run: choco install nasm --no-progress -y
        continue-on-error: true

      - name: Add NASM to the path
        run: Add-Content $env:GITHUB_PATH "C:\Program Files\NASM"

      - run: rustup show

      # Same reason as the Linux job: the engine's crates are identical from run
      # to run, so they are compiled once and kept.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fork-bundle-${{ runner.os }}
          cache-on-failure: true

      # Whether this window can be handed a frame at all is about the window's own
      # graphics device and not about the engine, so it is asked first: the answer
      # is worth having even from a run where nothing else builds.
      - name: Test what the window can be lent
        shell: bash
        run: |
          set -o pipefail
          cargo test --profile release-fast --package gpui_windows -- --nocapture 2>&1 |
            tee window-test.log

      - name: Say what the window found
        if: always()
        shell: bash
        run: grep -m1 '^SHARED:' window-test.log >> "$GITHUB_STEP_SUMMARY" || true

      # As an artifact as well as in the summary: an artifact can be fetched while
      # the rest of the run is still going, and a summary can only be looked at.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-window-test-log
          path: window-test.log
          if-no-files-found: ignore

      # Without colour, so that what went wrong can be picked out of the log
      # rather than read by eye once the run has finished.
      - name: Build with the HTML engine
        id: engine
        if: needs.plan.outputs.engine != ''
        continue-on-error: true
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo build --profile release-fast --package zed ${{ needs.plan.outputs.engine }} 2>&1 |
            tee engine-build.log

      # A build that fails here is followed by a whole build without the engine,
      # and a job's log can only be read once the job has finished -- so what
      # stopped it goes in the summary, which can be read while the rest runs.
      - name: Say what stopped the engine building
        if: always() && steps.engine.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '```'
            grep -E '^error' -A 12 engine-build.log | head -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && steps.engine.outcome == 'failure'
        with:
          name: windows-engine-build-log
          path: engine-build.log
          if-no-files-found: ignore

      - name: Build without the HTML engine
        if: needs.plan.outputs.engine == '' || steps.engine.outcome == 'failure'
        run: cargo build --profile release-fast --package zed

      # Proof that what was built starts at all, which a compile alone does not
      # promise on a platform nobody here can run.
      - name: Ask the editor for its usage
        run: target/release-fast/zed.exe --help

      - name: Report what came out
        run: |
          $exe = Get-Item target/release-fast/zed.exe
          $engine = if ('${{ steps.engine.outcome }}' -eq 'success') { 'yes' } else { 'no' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Add-Content $env:GITHUB_STEP_SUMMARY "size: $($exe.Length) bytes"
          Add-Content $env:GITHUB_STEP_SUMMARY "HTML engine compiled in: $engine"
          Add-Content $env:GITHUB_STEP_SUMMARY "sha256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: zed-windows-x86_64
          path: target/release-fast/zed.exe
          if-no-files-found: error

      # An executable is not an install. The repository's own bundler is what
      # assembles everything the editor needs beside it -- the console host the
      # terminal talks to, the shell integration, the uninstaller -- and it
      # skips code signing on its own when the secrets for it are absent, which
      # they are here. It builds the `release` profile itself, so this is a
      # second build rather than a wrapper around the one above.
      - name: Build the installer
        id: installer
        continue-on-error: true
        shell: pwsh
        run: script/bundle-windows.ps1 -Architecture x86_64

      - name: Say what the installer did
        if: always()
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path target -Recurse -Filter '*.exe' |
            Where-Object { $_.Name -like '*Setup*' -or $_.Name -like '*setup*' }
          if ('${{ steps.installer.outcome }}' -ne 'success' -or -not $found) {
            Add-Content $env:GITHUB_STEP_SUMMARY 'installer: not built'
            exit 0
          }
          foreach ($one in $found) {
            Add-Content $env:GITHUB_STEP_SUMMARY "installer: $($one.Name), $($one.Length) bytes"
          }

      # It has to install where it will be installed. Inno Setup's own silent
      # mode does the whole thing without a window, and the editor is then
      # asked for its usage from where it landed, which a build alone never
      # proves.
      - name: Install it and ask the editor its usage
        if: steps.installer.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path target -Recurse -Filter '*.exe' |
            Where-Object { $_.Name -like '*Setup*' -or $_.Name -like '*setup*' } |
            Select-Object -First 1
          if (-not $setup) { throw 'no installer to run' }
          Start-Process -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $installed = Get-ChildItem -Path "$env:LOCALAPPDATA","$env:ProgramFiles" `
            -Recurse -Filter 'Zed.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $installed) { throw 'the installer left no Zed.exe behind' }
          & $installed.FullName --help
          Add-Content $env:GITHUB_STEP_SUMMARY "installed and ran: $($installed.FullName)"

      - uses: actions/upload-artifact@v4
        if: steps.installer.outcome == 'success'
        with:
          name: zed-windows-x86_64-installer
          path: |
            target/**/*Setup*.exe
            target/**/*setup*.exe
          if-no-files-found: warn

      # Under bash, so that a failing test fails the step: PowerShell's own
      # pipeline swallows the exit code of whatever wrote into it, and merging
      # cargo's stderr there turns every progress line into an error.
      - name: Test the HTML engine
        if: steps.engine.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          cargo test --profile release-fast --package html_render \
            --features servo -- --nocapture 2>&1 | tee engine-test.log

      - name: Say whether the engine ran here
        if: always() && steps.engine.outcome == 'success'
        shell: bash
        run: grep -m1 '^HTML_ENGINE:' engine-test.log >> "$GITHUB_STEP_SUMMARY" || true

      # Last, so the editor and its artifact still come out of a run where the
      # engine would not compile -- but the run says so instead of passing
      # quietly with an editor that has no engine in it.
      - name: Insist the engine compiled
        if: needs.plan.outputs.engine != '' && steps.engine.outcome != 'success'
        shell: bash
        run: |
          echo "the HTML engine did not compile here; the editor above was built without it" >&2
          exit 1

  macos:
    needs: [plan, tests]
    if: needs.plan.outputs.macos != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.macos) }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - run: rustup show

      # Same reason as the Linux job: the engine's crates are identical from run
      # to run, so they are compiled once and kept.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fork-bundle-${{ runner.os }}
          cache-on-failure: true

      - name: Build with the HTML engine
        id: engine
        if: needs.plan.outputs.engine != ''
        continue-on-error: true
        run: cargo build --profile release-fast --package zed ${{ needs.plan.outputs.engine }}

      - name: Build without the HTML engine
        if: needs.plan.outputs.engine == '' || steps.engine.outcome == 'failure'
        run: cargo build --profile release-fast --package zed

      # Proof that what was built starts at all, which a compile alone does not
      # promise on a platform nobody here can run.
      - name: Ask the editor for its usage
        run: target/release-fast/zed --help

      # A hand-made bundle rather than `script/bundle-mac`: that script also
      # builds the remote server, downloads a git to embed and signs with the
      # project's own identity, none of which a test build needs.
      - name: Wrap the binary in an app bundle
        run: |
          set -euo pipefail
          app="target/Zed.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release-fast/zed "$app/Contents/MacOS/zed"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Zed</string>
            <key>CFBundleDisplayName</key><string>Zed</string>
            <key>CFBundleIdentifier</key><string>dev.zed.Zed-Dev</string>
            <key>CFBundleExecutable</key><string>zed</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.0.0</string>
            <key>CFBundleVersion</key><string>0.0.0</string>
            <key>LSMinimumSystemVersion</key><string>10.15.7</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "target/Zed-macos-${{ matrix.target.arch }}.app.zip"

          # A disk image is how a Mac expects to be given an application: it
          # opens to the app beside a link to Applications, and dragging one
          # onto the other is the install. The zip stays for anyone who would
          # rather unpack it.
          dmg="target/Zed-macos-${{ matrix.target.arch }}.dmg"
          staging="$(mktemp -d)"
          ditto "$app" "$staging/Zed.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Zed -srcfolder "$staging" -ov -format UDZO "$dmg"
          rm -rf "$staging"

          if [ '${{ steps.engine.outcome }}' = 'success' ]; then engine=yes; else engine=no; fi
          {
            echo "size: $(du -h "target/Zed-macos-${{ matrix.target.arch }}.app.zip" | cut -f1)"
            echo "disk image: $(du -h "$dmg" | cut -f1)"
            echo "HTML engine compiled in: $engine"
            echo
            echo "The app is signed ad-hoc, not notarised, so the first launch"
            echo "needs Open from the right-click menu, or"
            echo '`xattr -dr com.apple.quarantine /Applications/Zed.app`.'
          } >> "$GITHUB_STEP_SUMMARY"

      # It has to open where it will be opened. A disk image that will not
      # mount, or mounts without the app in it, is worth knowing about here
      # rather than on the reader's machine.
      - name: Mount the disk image and look inside it
        run: |
          set -euo pipefail
          dmg="target/Zed-macos-${{ matrix.target.arch }}.dmg"
          mount="$(mktemp -d)"
          hdiutil attach -quiet -nobrowse -mountpoint "$mount" "$dmg"
          test -x "$mount/Zed.app/Contents/MacOS/zed"
          test -L "$mount/Applications"
          plutil -lint "$mount/Zed.app/Contents/Info.plist"
          hdiutil detach -quiet "$mount"
          echo "the disk image mounts and holds the app" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: zed-macos-${{ matrix.target.arch }}
          path: |
            target/Zed-macos-${{ matrix.target.arch }}.app.zip
            target/Zed-macos-${{ matrix.target.arch }}.dmg
          if-no-files-found: error

      - name: Test the HTML engine
        if: steps.engine.outcome == 'success'
        run: |
          set -o pipefail
          cargo test --profile release-fast --package html_render \
            --features servo -- --nocapture 2>&1 | tee engine-test.log

      - name: Say whether the engine ran here
        if: always() && steps.engine.outcome == 'success'
        run: grep -m1 '^HTML_ENGINE:' engine-test.log >> "$GITHUB_STEP_SUMMARY" || true

  # The bundles are built either way, but as artifacts of the run they are
  # behind a login and come down as zips of zips. A release is a plain link per
  # file, which is what somebody installing this actually needs.
  #
  # Every build of the branch publishes one, and the weekly schedule above
  # makes sure a week with changes ends in a release even without a push. A
  # week without changes to the editor ends in nothing: the step below says so.
  release:
    name: Publish the bundles where they can be downloaded
    needs: [plan, tests, linux, windows, macos]
    if: >-
      always() && !cancelled()
      && !contains(needs.*.result, 'failure')
      && endsWith(github.ref, '/personal_zed_fork')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Everything the platform jobs built, unpacked into one directory: the
      # files themselves, not the artifact containers they travelled in.
      - uses: actions/download-artifact@v4
        with:
          pattern: zed-*
          path: bundles
          merge-multiple: true

      # A release is for changes to the editor. A week in which only the
      # workflow or a document moved has nothing to hand anybody, and a release
      # that carries the same editor as the last one is only noise to scroll
      # past when looking for the one that changed something.
      - name: Say whether the editor itself changed since the last release
        id: changed
        run: |
          set -euo pipefail
          previous="$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)"
          if [ -z "$previous" ] || ! git rev-parse -q --verify "$previous^{commit}" > /dev/null; then
            echo "there is no release to compare against, so this is the first"
            echo "commits=1" >> "$GITHUB_OUTPUT"
            echo "previous=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commits="$(git rev-list --count "$previous..HEAD" -- \
            crates assets Cargo.toml Cargo.lock rust-toolchain.toml script)"
          # A run somebody started by hand is the asking itself, so it
          # publishes whether or not the editor changed.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            commits=1
          fi
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          if [ "$commits" = "0" ]; then
            echo "The editor has not changed since \`$previous\`, so no release." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Name the release after the day and the commit
        if: steps.changed.outputs.commits != '0'
        id: name
        run: |
          set -euo pipefail
          echo "tag=fork-$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Say what is in it
        if: steps.changed.outputs.commits != '0'
        id: notes
        run: |
          set -euo pipefail
          previous="${{ steps.changed.outputs.previous }}"
          {
            echo "Built from \`personal_zed_fork\` at ${GITHUB_SHA::7}."
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            for file in bundles/*; do
              [ -f "$file" ] || continue
              case "$file" in
                *.deb)     echo "| Linux (Debian, Ubuntu) | \`$(basename "$file")\` |" ;;
                *.rpm)     echo "| Linux (Fedora, RHEL) | \`$(basename "$file")\` |" ;;
                *.tar.gz)  echo "| Linux (any) | \`$(basename "$file")\` |" ;;
                *.dmg)     echo "| macOS | \`$(basename "$file")\` |" ;;
                *.app.zip) echo "| macOS (unpacked app) | \`$(basename "$file")\` |" ;;
                *.exe)     echo "| Windows | \`$(basename "$file")\` |" ;;
                *)         echo "| | \`$(basename "$file")\` |" ;;
              esac
            done
            # Only when the tag is one this checkout actually has: a release
            # list can name a tag that was never fetched, and asking git for a
            # range it cannot resolve would take the whole step down with it.
            if [ -n "$previous" ] && git rev-parse -q --verify "$previous^{commit}" > /dev/null; then
              echo
              echo "## What changed since \`$previous\`"
              echo
              git log --no-merges --pretty='- %s' -n 50 "$previous..HEAD" || true
            fi
          } > notes.md
          # What this fork is and what it costs, which is the same every time
          # and so is kept as a document rather than written out here.
          echo >> notes.md
          cat .github/fork-release-notes.md >> notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish it
        if: steps.changed.outputs.commits != '0'
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(bundles/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing was built, so there is nothing to publish" >&2
            exit 1
          fi
          gh release create "${{ steps.name.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "Zed fork ${{ steps.name.outputs.tag }}" \
            --notes-file notes.md \
            "${files[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
