name: "Run tests"
description: "Runs the tests"

runs:
  using: "composite"
  steps:
    - name: Install nextest
      uses: taiki-e/install-action@921e2c9f7148d7ba14cd819f417db338f63e733c # nextest

    - name: Install Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "18"

    - name: Limit target directory size
      shell: bash -euxo pipefail {0}
      run: script/clear-target-dir-if-larger-than 350 200

    - name: Run tests
      shell: bash -euxo pipefail {0}
      # Kept as a file as well as printed: this job's log is not always
      # retrievable afterwards, and a red run whose reason cannot be read is a
      # red run nobody can fix.
      run: |
        set -o pipefail
        cargo nextest run --workspace --no-fail-fast \
          --failure-output immediate-final 2>&1 | tee nextest.log

    - name: Keep what the run said
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: nextest-log
        path: nextest.log
        retention-days: 7
