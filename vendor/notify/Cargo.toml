[package]
name = "notify"
version = "9.0.0-rc.4"
description = "Cross-platform filesystem notification library"
documentation = "https://docs.rs/notify"
license = "CC0-1.0"
keywords = ["events", "filesystem", "notify", "watch"]
categories = ["filesystem"]
authors = ["F\u00e9lix Saparelli <me@passcod.name>", "Daniel Faust <hessijames@gmail.com>", "Aron Heinecke <Ox0p54r36@t-online.de>"]
rust-version = "1.88"
edition = "2021"
homepage = "https://github.com/notify-rs/notify"
repository = "https://github.com/notify-rs/notify.git"

[features]
default = ["macos_fsevent"]
serde = ["notify-types/serde"]
macos_kqueue = ["kqueue", "mio"]
macos_fsevent = ["objc2-core-foundation", "objc2-core-services"]
serialization-compat-6 = ["notify-types/serialization-compat-6"]
tokio = ["dep:tokio"]
futures = ["dep:futures"]

[dependencies]
notify-types = "2.1.0"
crossbeam-channel = { version = "0.5.0", optional = true }
flume = { version = "0.12.0", optional = true }
libc = "0.2.4"
log = "0.4.17"
walkdir = "2.4.0"
futures = { version = "0.3.30", optional = true }
tokio = { version = "1.49.0", default-features = false, optional = true, features = ["sync"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[target.'cfg(any(target_os="linux", target_os="android"))'.dependencies]
inotify = { version = "0.11.0", default-features = false }
mio = { version = "1.0", features = ["os-ext"] }

[target.'cfg(target_os="macos")'.dependencies]
bitflags = "2.7.0"
objc2-core-foundation = { version = "0.3.2", default-features = false, optional = true, features = ["std", "CFDate", "CFString", "CFArray", "CFRunLoop", "CFError", "CFURL"] }
objc2-core-services = { version = "0.3.2", default-features = false, optional = true, features = ["std", "libc", "FSEvents"] }
kqueue = { version = "1.2.0", optional = true }
mio = { version = "1.0", optional = true, features = ["os-ext"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.0", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_WindowsProgramming", "Win32_System_IO"] }

[target.'cfg(any(target_os="freebsd", target_os="openbsd", target_os = "netbsd", target_os = "dragonfly", target_os = "ios"))'.dependencies]
kqueue = "1.2.0"
mio = { version = "1.0", features = ["os-ext"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
trash = "5.2.2"

[dev-dependencies]
serde_json = "1.0.39"
tempfile = "3.10.0"
nix = "0.31.0"
insta = "1.34.0"
pretty_assertions = "1.3.0"
tokio = { version = "1.49.0", features = ["sync", "time", "rt", "macros"] }
